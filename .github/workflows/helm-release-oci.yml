name: Release OCI Helm Charts

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'charts/**'

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # - name: Set up Helm
      #   uses: azure/setup-helm@v4
      #   env:
      #     GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Add Helm Repos
        run: |
          helm repo add hknlab https://charts.hknlab.io

      - name: Log in to the OCI registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@main
        with:
          version: v1.8.1
          # charts_dir: charts
          # config: cr.yaml
          # oci_registry_url: oci://ghcr.io/${{ github.repository_owner }}/charts
          # skip_upload: true
          # skip_existing: false
          # options: "--force"
          install_only: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Package charts
        run: |
          for chart in charts/*/; do
            echo "Packaging chart $chart"
            cr package "$chart" \
              --package-path .cr-release-packages \
              --config cr.yaml
          done

      - name: Push charts
        run: |
          cr push \
            --registry-url "oci://ghcr.io/${{ github.repository_owner }}/charts" \
            --package-path .cr-release-packages
